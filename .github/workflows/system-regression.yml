name: System regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e-and-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run system E2E and performance smoke tests
        run: npm run e2e:system
