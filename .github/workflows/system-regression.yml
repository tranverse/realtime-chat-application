name: System regression

on:
  pull_request:
  push:
    branches: [main, "docs/public-readme-cleanup"]

permissions:
  contents: read

jobs:
  e2e-and-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out system and pinned submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Validate system CI configuration
        run: npm run validate:ci
      - name: Install Chromium and Linux browser dependencies
        run: npx playwright install --with-deps chromium
      - name: Run system E2E and performance smoke tests
        run: npm run e2e:system
